<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Article | bangjeje.dev CMS</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-blot-formatter@1.0.5/dist/quill-blot-formatter.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="https://cdn.bangjeje.dev/bangjeje.dev/bjjfavicon.svg">
  </head>
  <body
    x-data="{  page: 'Articles', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false, 'pageTitle': 'Edit Article', 'pageDescription': 'Modify existing article.', 'primaryActionText': 'Publish Changes', 'primaryActionUrl': '#', 'secondaryActionText': 'Cancel', 'secondaryActionUrl': 'articles.html' , 'darkMode': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark text-gray-400 bg-gray-dark': darkMode === true}"
    class="bg-gray-50 text-gray-800 dark:text-white/90"
  >
    <include src="./partials/preloader.html"></include>
    <div class="flex h-screen overflow-hidden">
      <include src="./partials/sidebar.html"></include>
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <include src="./partials/header.html" />
                        <main x-data="dashboardData()" class="relative">
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6 lg:p-10" 
               x-data="{ 
                 articleData: { id: '', title: '', slug: '', excerpt: '', content: '', status: 'draft', featuredImage: null, category: '', tags: [] },
                 autoSlug: false,
                 showToast: false,
                 errors: {},
                 tagInput: '',
                 initEditor() {
                   Quill.register('modules/blotFormatter', QuillBlotFormatter.default);
                   const quill = new Quill('#editor-container', {
                     theme: 'snow',
                     modules: {
                       blotFormatter: {},
                       toolbar: [
                         ['bold', 'italic', 'underline'],
                         [{ 'header': 2 }, { 'header': 3 }],
                         [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                         ['blockquote', 'code-block'],
                         ['link', 'image'],
                         [{ 'align': [] }],
                         ['clean']
                       ]
                     }
                   });
                   quill.on('text-change', () => {
                     this.articleData.content = quill.root.innerHTML;
                     if (quill.getText().trim() === '') {
                         this.articleData.content = '';
                     }
                   });
                   if (this.articleData.content) {
                     quill.root.innerHTML = this.articleData.content;
                   }
                 },
                 handleImageUpload(event) {
                   const file = event.target.files[0];
                   if (file && ['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                     const reader = new FileReader();
                     reader.onload = (e) => {
                       this.articleData.featuredImage = e.target.result;
                     };
                     reader.readAsDataURL(file);
                   }
                 },
                 removeImage() {
                   this.articleData.featuredImage = null;
                   document.getElementById('image-upload').value = '';
                 },
                 addTag() {
                   const tag = this.tagInput.trim();
                   if (tag && !this.articleData.tags.includes(tag)) {
                     this.articleData.tags.push(tag);
                   }
                   this.tagInput = '';
                 },
                 removeTag(tagToRemove) {
                   this.articleData.tags = this.articleData.tags.filter(t => t !== tagToRemove);
                 },
                 validate() {
                   this.errors = {};
                   if (!this.articleData.title.trim()) this.errors.title = 'Title is required';
                   if (!this.articleData.slug.trim()) this.errors.slug = 'Slug is required';
                   if (!this.articleData.excerpt.trim()) this.errors.excerpt = 'Excerpt is required';
                   if (!this.articleData.content.trim() || this.articleData.content === '<p><br></p>') this.errors.content = 'Content is required';
                   if (!this.articleData.category) this.errors.category = 'Category is required';
                   
                   if (Object.keys(this.errors).length > 0) {
                     const firstError = Object.keys(this.errors)[0];
                     const el = document.getElementById('field-' + firstError);
                     if (el) el.focus();
                     return false;
                   }
                   return true;
                 },
                 save(status) {
                   if (!this.validate()) return;
                   this.articleData.status = status;
                   this.updateArticle(this.articleData.id, this.articleData);
                   this.showToast = true;
                   setTimeout(() => { window.location.href = 'articles.html'; }, 1000);
                 }
               }"
               x-init="
                 init();
                 const urlParams = new URLSearchParams(window.location.search);
                 const articleId = urlParams.get('id');
                 const found = articles.find(a => a.id === articleId);
                 if (found) {
                   articleData = JSON.parse(JSON.stringify({
                     ...found,
                     category: found.category || '',
                     tags: found.tags || [],
                     featuredImage: found.featuredImage || null
                   }));
                 } else {
                   window.location.href = 'articles.html';
                 }
                 
                 $watch('articleData.title', value => {
                   if (autoSlug) {
                     articleData.slug = value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
                     if (articleData.slug) delete errors.slug;
                   }
                   if (value) delete errors.title;
                 });
                 $watch('articleData.slug', value => { if (value) delete errors.slug; });
                 $watch('articleData.excerpt', value => { if (value) delete errors.excerpt; });
                 $watch('articleData.content', value => { if (value && value !== '<p><br></p>') delete errors.content; });
                 $watch('articleData.category', value => { if (value) delete errors.category; });
                 setTimeout(() => initEditor(), 100);
               ">
            <include src="./partials/page-header.html" />
            
            <div class="flex flex-col xl:flex-row gap-6 mt-8">
              
              <!-- Main Form Column -->
              <div class="flex-1 flex flex-col gap-6">
                <!-- Featured Image -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm p-6">
                  <h3 class="mb-5 text-lg font-bold text-black dark:text-white">Featured Image</h3>
                  
                  <div class="flex flex-col gap-4">
                    <!-- Upload Box -->
                    <div x-show="!articleData.featuredImage" class="relative flex flex-col items-center justify-center rounded-lg border-2 border-dashed border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 p-10 text-center hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer" @click="document.getElementById('image-upload').click()">
                      <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-white dark:bg-gray-900 shadow-theme-sm">
                        <svg class="h-6 w-6 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                      </div>
                      <p class="text-sm font-medium text-black dark:text-white">Click to upload image</p>
                      <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Recommended: 1200 &times; 800 px<br>JPG, PNG, WebP</p>
                    </div>
                    
                    <!-- Preview Box -->
                    <div x-show="articleData.featuredImage" class="relative overflow-hidden rounded-lg border border-gray-200 dark:border-gray-700 group" style="display: none;">
                      <img :src="articleData.featuredImage" alt="Featured Image Preview" class="w-full h-auto object-cover max-h-80" />
                      <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-4">
                        <button @click="document.getElementById('image-upload').click()" class="rounded-lg bg-white px-4 py-2 text-sm font-medium text-gray-900 hover:bg-gray-50">Replace</button>
                        <button @click="removeImage()" class="rounded-lg bg-error-500 px-4 py-2 text-sm font-medium text-white hover:bg-error-600">Remove</button>
                      </div>
                    </div>
                    
                    <input id="image-upload" type="file" accept="image/jpeg, image/png, image/webp" class="hidden" @change="handleImageUpload" />
                  </div>
                </div>


                <!-- General Info -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm p-6">
                  <h3 class="mb-5 text-lg font-bold text-black dark:text-white">General Information</h3>
                  
                  <div class="flex flex-col gap-5">
                    <div>
                      <label class="mb-2.5 block font-medium text-black dark:text-white">Title <span class="text-error-500">*</span></label>
                      <input id="field-title" type="text" x-model="articleData.title" placeholder="Enter article title" class="w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent px-5 py-3 outline-none focus:border-brand-500 dark:focus:border-brand-500 text-black dark:text-white" :class="{'border-error-500': errors.title}" />
                      <p x-show="errors.title" x-text="errors.title" class="mt-1 text-sm text-error-500"></p>
                    </div>
                    
                    <div>
                      <label class="mb-2.5 block font-medium text-black dark:text-white">Slug <span class="text-error-500">*</span></label>
                      <input id="field-slug" type="text" x-model="articleData.slug" @input="autoSlug = false" placeholder="article-url-slug" class="w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent px-5 py-3 outline-none focus:border-brand-500 dark:focus:border-brand-500 text-black dark:text-white" :class="{'border-error-500': errors.slug}" />
                      <p x-show="errors.slug" x-text="errors.slug" class="mt-1 text-sm text-error-500"></p>
                    </div>
                    
                    <div>
                      <label class="mb-2.5 block font-medium text-black dark:text-white">Excerpt <span class="text-error-500">*</span></label>
                      <textarea id="field-excerpt" rows="3" x-model="articleData.excerpt" placeholder="Short summary for preview cards" class="w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent px-5 py-3 outline-none focus:border-brand-500 dark:focus:border-brand-500 text-black dark:text-white" :class="{'border-error-500': errors.excerpt}"></textarea>
                      <p x-show="errors.excerpt" x-text="errors.excerpt" class="mt-1 text-sm text-error-500"></p>
                    </div>
                  </div>
                </div>

                <!-- Editor -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm p-6" id="field-content">
                  <div class="mb-5 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-black dark:text-white">Content <span class="text-error-500">*</span></h3>
                    <span class="text-xs text-gray-500 dark:text-gray-400">Recommended image: 1600 &times; 900 px</span>
                  </div>
                  <div>
                    <div id="editor-container" class="w-full rounded-b-lg border-x border-b border-gray-200 dark:border-gray-700 bg-transparent text-black dark:text-white" style="height: 400px;" :class="{'border-error-500': errors.content}"></div>
                    <p x-show="errors.content" x-text="errors.content" class="mt-1 text-sm text-error-500"></p>
                  </div>
                </div>
                
              </div>

              <!-- Sidebar Column -->
              <div class="w-full xl:w-1/3 flex flex-col gap-6">
                <!-- Publishing -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm p-6">
                  <h3 class="mb-5 text-lg font-bold text-black dark:text-white">Publishing</h3>
                  
                  <div class="mb-4">
                    <p class="text-sm text-gray-500 dark:text-gray-400">Current Status: <span class="font-medium text-black dark:text-white" x-text="formatStatus(articleData.status)"></span></p>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" x-show="articleData.publishedAt">Published on: <span x-text="formatDate(articleData.publishedAt)"></span></p>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Last updated: <span x-text="formatDate(articleData.updatedAt)"></span></p>
                  </div>

                  <div class="flex flex-col gap-4">
                    <button @click="save('published')" class="flex w-full items-center justify-center rounded-lg bg-brand-500 px-5 py-3 font-medium text-white hover:bg-brand-600 transition-colors" x-text="articleData.status === 'published' ? 'Update Article' : 'Publish Now'">
                    </button>
                    <button @click="save('draft')" class="flex w-full items-center justify-center rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 px-5 py-3 font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors" x-show="articleData.status !== 'draft'">
                      Switch to Draft
                    </button>
                    <button @click="save('draft')" class="flex w-full items-center justify-center rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 px-5 py-3 font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors" x-show="articleData.status === 'draft'">
                      Save Draft
                    </button>
                  </div>
                </div>
                
                <!-- Category -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm p-6">
                  <h3 class="mb-5 text-lg font-bold text-black dark:text-white">Category <span class="text-error-500">*</span></h3>
                  <div>
                    <select id="field-category" x-model="articleData.category" class="w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent px-5 py-3 outline-none focus:border-brand-500 dark:focus:border-brand-500 text-black dark:text-white" :class="{'border-error-500': errors.category}">
                      <option value="" disabled>Select a category...</option>
                      <option value="Web Design">Web Design</option>
                      <option value="UI/UX">UI/UX</option>
                      <option value="Development">Development</option>
                      <option value="Business">Business</option>
                      <option value="Growth">Growth</option>
                      <option value="Technology">Technology</option>
                    </select>
                    <p x-show="errors.category" x-text="errors.category" class="mt-1 text-sm text-error-500"></p>
                  </div>
                </div>
                
                <!-- Tags -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm p-6">
                  <h3 class="mb-5 text-lg font-bold text-black dark:text-white">Tags</h3>
                  <div>
                    <div class="flex flex-wrap gap-2 mb-3" x-show="articleData.tags.length > 0">
                      <template x-for="tag in articleData.tags" :key="tag">
                        <span class="inline-flex items-center gap-1.5 rounded-full bg-gray-100 dark:bg-gray-800 px-3 py-1 text-sm font-medium text-gray-800 dark:text-gray-200">
                          <span x-text="tag"></span>
                          <button @click="removeTag(tag)" class="text-gray-500 hover:text-error-500 transition-colors">
                            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                          </button>
                        </span>
                      </template>
                    </div>
                    <input type="text" x-model="tagInput" @keydown.enter.prevent="addTag()" placeholder="Add a tag and press Enter" class="w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent px-5 py-3 outline-none focus:border-brand-500 dark:focus:border-brand-500 text-black dark:text-white text-sm" />
                  </div>
                </div>

              </div>
              
            </div>

            <!-- Toast -->
            <div x-show="showToast" x-transition class="fixed bottom-10 right-10 z-[99999] flex w-full max-w-xs items-center gap-4 rounded-xl bg-white dark:bg-gray-900 px-5 py-4 shadow-theme-md border border-gray-100 dark:border-gray-800" style="display: none;">
              <div class="flex h-10 w-10 items-center justify-center rounded-full bg-success-50 dark:bg-success-500/15 text-success-500">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <div>
                <h4 class="font-medium text-black dark:text-white">Success</h4>
                <p class="text-sm text-gray-500 dark:text-gray-400">Article updated successfully.</p>
              </div>
            </div>

          </div>
        </main>
      </div>
    </div>
  </body>
</html>
