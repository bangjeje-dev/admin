<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | bangjeje.dev CMS</title>
  </head>
  <body
    x-data="{  page: 'dashboard', 'loaded': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false, 'pageTitle': 'Dashboard', 'pageDescription': 'Overview of your content and digital resources.' , 'darkMode': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark text-gray-400 bg-gray-dark': darkMode === true}"
    class="bg-gray-50 text-gray-800 dark:text-white/90"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main x-data="dashboardData()">
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6 lg:p-10">
            
            <include src="./partials/page-header.html" />
            
            <div class="flex flex-col gap-8">

              <!-- SUMMARY CARDS -->
              <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
                
                <!-- Card 1 -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 shadow-theme-sm">
                  <div class="flex items-center justify-between">
                    <div>
                      <h4 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide">Articles</h4>
                      <h3 class="mt-2 text-3xl font-bold text-black dark:text-white" x-text="articles.length"></h3>
                    </div>
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 dark:bg-brand-500/15 text-brand-500">
                      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5a2.5 2.5 0 00-2.5-2.5H15M9 11l3 3L22 4" />
                      </svg>
                    </div>
                  </div>
                  <div class="mt-4 flex items-center gap-2">
                    <span class="inline-block text-sm font-medium text-success-500 dark:text-success-400"><span x-text="articlesCreatedThisMonth > 0 ? '+' + articlesCreatedThisMonth : articlesCreatedThisMonth"></span></span>
                    <span class="text-sm text-gray-500 dark:text-gray-400">this month</span>
                  </div>
                </div>

                <!-- Card 2 -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 shadow-theme-sm">
                  <div class="flex items-center justify-between">
                    <div>
                      <h4 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide">Case Studies</h4>
                      <h3 class="mt-2 text-3xl font-bold text-black dark:text-white" x-text="caseStudies.length"></h3>
                    </div>
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 dark:bg-brand-500/15 text-brand-500">
                      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                      </svg>
                    </div>
                  </div>
                  <div class="mt-4 flex items-center gap-2">
                    <span class="inline-block text-sm font-medium text-success-500 dark:text-success-400"><span x-text="caseStudiesCreatedThisMonth > 0 ? '+' + caseStudiesCreatedThisMonth : caseStudiesCreatedThisMonth"></span></span>
                    <span class="text-sm text-gray-500 dark:text-gray-400">this month</span>
                  </div>
                </div>

                <!-- Card 3 -->
                <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 shadow-theme-sm">
                  <div class="flex items-center justify-between">
                    <div>
                      <h4 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide">Digital Assets</h4>
                      <h3 class="mt-2 text-3xl font-bold text-black dark:text-white" x-text="digitalAssets.length"></h3>
                    </div>
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 dark:bg-brand-500/15 text-brand-500">
                      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                      </svg>
                    </div>
                  </div>
                  <div class="mt-4 flex items-center gap-2">
                    <span class="inline-block text-sm font-medium text-gray-400"><span x-text="digitalAssetsCreatedThisMonth > 0 ? '+' + digitalAssetsCreatedThisMonth : digitalAssetsCreatedThisMonth"></span></span>
                    <span class="text-sm text-gray-500 dark:text-gray-400">this month</span>
                  </div>
                </div>

              </div>

              <!-- MAIN CONTENT GRID -->
              <div class="grid grid-cols-1 gap-6 xl:grid-cols-3">
                
                <!-- Left Column (Recent Articles) -->
                <div class="xl:col-span-2 flex flex-col gap-6">
                  
                  <!-- Recent Articles -->
                  <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm">
                    <div class="border-b border-gray-100 dark:border-gray-800 px-6 py-5 flex items-center justify-between">
                      <h3 class="text-lg font-bold text-black dark:text-white">Recent Articles</h3>
                      <a href="articles.html" class="text-sm font-medium text-brand-500 hover:text-brand-600">View All</a>
                    </div>
                    
                    <div class="max-w-full overflow-x-auto">
                      <table class="w-full table-auto">
                        <thead>
                          <tr class="bg-gray-50 text-left">
                            <th class="py-4 px-6 text-sm font-medium text-gray-500 dark:text-gray-400">Title</th>
                            <th class="py-4 px-6 text-sm font-medium text-gray-500 dark:text-gray-400">Status</th>
                            <th class="py-4 px-6 text-sm font-medium text-gray-500 dark:text-gray-400">Published</th>
                            <th class="py-4 px-6 text-sm font-medium text-gray-500 dark:text-gray-400">Updated</th>
                          </tr>
                        </thead>
                        <tbody>
  <template x-for="article in recentArticles" :key="article.id">
    <tr class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50">
      <td class="py-4 px-6">
        <p class="font-medium text-black dark:text-white" x-text="article.title"></p>
      </td>
      <td class="py-4 px-6">
        <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium"
              :class="article.status === 'published' ? 'bg-success-50 dark:bg-success-500/15 text-success-600 dark:text-success-400' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300'"
              x-text="formatStatus(article.status)"></span>
      </td>
      <td class="py-4 px-6">
        <p class="text-sm text-gray-600 dark:text-gray-300" x-text="formatDate(article.publishedAt)"></p>
      </td>
      <td class="py-4 px-6">
        <p class="text-sm text-gray-500 dark:text-gray-400" x-text="formatDate(article.updatedAt)"></p>
      </td>
    </tr>
  </template>
</tbody>
                      </table>
                    </div>
                  </div>

                  <!-- Recent Case Studies -->
                  <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm">
                    <div class="border-b border-gray-100 dark:border-gray-800 px-6 py-5 flex items-center justify-between">
                      <h3 class="text-lg font-bold text-black dark:text-white">Recent Case Studies</h3>
                      <a href="case-studies.html" class="text-sm font-medium text-brand-500 hover:text-brand-600">View All</a>
                    </div>
                    
                    <div class="flex flex-col">
                        <template x-for="caseStudy in recentCaseStudies" :key="caseStudy.id">
                          <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-800 px-6 py-4 hover:bg-gray-50">
                            <div>
                              <h4 class="font-medium text-black dark:text-white" x-text="caseStudy.title"></h4>
                              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" x-text="caseStudy.category"></p>
                            </div>
                            <div class="text-right">
                              <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium mb-1"
                                    :class="caseStudy.status === 'published' ? 'bg-success-50 dark:bg-success-500/15 text-success-600 dark:text-success-400' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300'"
                                    x-text="formatStatus(caseStudy.status)"></span>
                              <p class="text-xs text-gray-500 dark:text-gray-400" x-text="formatDate(caseStudy.updatedAt)"></p>
                            </div>
                          </div>
                        </template>
                      </div></div>

                </div>

                <!-- Right Column (Recent Activity) -->
                <div class="xl:col-span-1">
                  <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-theme-sm h-full">
                    <div class="border-b border-gray-100 dark:border-gray-800 px-6 py-5">
                      <h3 class="text-lg font-bold text-black dark:text-white">Recent Activity</h3>
                    </div>
                    
                    <div class="p-6">
                      <div class="relative border-l-2 border-gray-100 dark:border-gray-800 ml-3 flex flex-col gap-6">
                          <template x-for="activity in recentActivities" :key="activity.id">
                            <div class="relative pl-6">
                              <span class="absolute left-[-9px] top-1 flex h-4 w-4 items-center justify-center rounded-full ring-4 ring-white dark:ring-gray-900"
                                    :class="activity.type.includes('publish') || activity.type.includes('upload') ? 'bg-success-500' : 'bg-brand-500'"></span>
                              <p class="text-sm text-gray-500 dark:text-gray-400 mb-0.5" x-text="formatStatus(activity.type.replace('_', ' '))"></p>
                              <h4 class="text-sm font-medium text-black dark:text-white" x-text="activity.message"></h4>
                              <p class="text-xs text-gray-400 mt-1.5" x-text="formatDate(activity.createdAt)"></p>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

              </div>

            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
