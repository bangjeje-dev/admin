<!-- Reusable Modal Pattern -->
<div x-show="modalOpen" class="fixed inset-0 z-99999 flex items-center justify-center bg-black/50 px-4 py-6" x-cloak>
  <div class="w-full max-w-md rounded-2xl bg-white px-8 py-8 shadow-theme-lg dark:bg-gray-dark text-center" @click.outside="modalOpen = false">
    
    <div class="mx-auto mb-6 flex h-14 w-14 items-center justify-center rounded-full bg-error-50 text-error-500">
      <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>

    <h3 class="mb-3 text-2xl font-bold text-black dark:text-white" x-text="modalTitle || 'Are you sure?'"></h3>
    <p class="mb-8 text-base text-gray-500" x-text="modalDescription || 'This action cannot be undone.'"></p>

    <div class="flex items-center gap-4">
      <button @click="modalOpen = false" class="flex w-full items-center justify-center rounded-lg border border-gray-300 bg-white px-5 py-3 font-medium text-gray-700 hover:bg-gray-50">
        Cancel
      </button>
      <button class="flex w-full items-center justify-center rounded-lg bg-error-500 px-5 py-3 font-medium text-white hover:bg-error-600">
        Confirm
      </button>
    </div>

  </div>
</div>
