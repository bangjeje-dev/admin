<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h2 class="text-title-md2 font-semibold text-black dark:text-white dark:text-white" x-text="pageTitle || 'Dashboard'">
      Dashboard
    </h2>
    <p class="text-gray-500 dark:text-gray-400 mt-1" x-text="pageDescription || ''"></p>
  </div>
  <div class="flex items-center gap-3">
    
    <!-- Secondary Action -->
    <a 
      x-show="secondaryActionText"
      :href="secondaryActionUrl || '#'"
      x-text="secondaryActionText"
      class="inline-flex items-center justify-center rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 px-5 py-2.5 text-center font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50"
    ></a>

    <!-- Primary Action -->
    <a 
      x-show="primaryActionText"
      :href="primaryActionUrl || '#'"
      x-text="primaryActionText"
      class="inline-flex items-center justify-center rounded-lg bg-brand-500 px-5 py-2.5 text-center font-medium text-white hover:bg-brand-600"
    ></a>

  </div>
</div>
